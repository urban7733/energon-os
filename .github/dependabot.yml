version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-patches:
        update-types: [patch]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      js-patches:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories: [/, /apps/web]
    schedule:
      interval: weekly
