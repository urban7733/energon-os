name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly, so newly published advisories surface even without code changes.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-advisories:
    name: Rust advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Ignored advisories and their justification live in .cargo/audit.toml.
      - name: Audit Cargo.lock
        run: cargo audit

  js-advisories:
    name: JavaScript advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit bun.lock
        run: bun audit
