[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energon-trainer"
version = "0.1.0"
description = "Nightly training for Energon agents: self-play, LoRA adapters, compiled instructions and held-out evals."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Urban Herak" }]
dependencies = []

[project.optional-dependencies]
# GPU image only: serving, training and object storage.
gpu = [
  "vllm>=0.6.3",
  "unsloth>=2024.11",
  "trl>=0.12",
  "peft>=0.13",
  "datasets>=3.0",
  "boto3>=1.35",
  "runpod>=1.7",
]
dev = ["pytest>=8"]

[project.scripts]
energon-train = "energon_trainer.cli:main"

[tool.setuptools.packages.find]
include = ["energon_trainer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
